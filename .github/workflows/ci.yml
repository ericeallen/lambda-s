name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: No sorry in the sources
        run: |
          if grep -rnE '^[[:space:]]*(sorry|admit)\b' LambdaS/ Main.lean; then
            echo "::error::sorry or admit found in the development"
            exit 1
          fi

      - name: Audit the trust base
        run: |
          lake env lean scripts/Audit.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then
            echo "::error::a headline theorem depends on sorryAx"
            exit 1
          fi
          if grep -v 'propext, Classical.choice, Quot.sound' axioms.txt | grep -q 'depends on axioms'; then
            echo "::error::a theorem depends on axioms beyond the standard three"
            exit 1
          fi
          cat axioms.txt

      - name: Run the compiled binary and assert its numeric checks
        run: |
          out=$(.lake/build/bin/lambdas) || { echo "::error::binary exited nonzero: run-time validation failed"; exit 1; }
          echo "$out"
          echo "$out" | grep -Eq "all numeric checks pass +=[[:space:]]*true" || { echo "::error::binary numeric self-checks failed"; exit 1; }
          echo "$out" | grep -Eq "literals through dgemv +=[[:space:]]*pass" || { echo "::error::literal-program validation missing or failed"; exit 1; }
          echo "$out" | grep -q "300.000000 ft" || { echo "::error::yard-to-feet line missing from the binary output"; exit 1; }
          echo "$out" | grep -Eq "via ft.*91\.440000 m" || { echo "::error::path-independence line missing from the binary output"; exit 1; }
